name: Validate skill repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure-and-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Validate repository and skill structure
        run: python scripts/validate_skill.py
      - name: Check shared skill copies
        run: python scripts/sync_shared_copies.py --check
      - name: Run repository convention tests
        run: python -m unittest discover -s tests -v
      - name: Validate repeatable behavior scenarios
        run: python scripts/validate_evals.py
      - name: Validate public-safety behavior scenarios
        run: python scripts/validate_safety_evals.py
      - name: Validate interaction-risk acceptance cases
        run: python scripts/validate_interaction_risk_evals.py
      - name: Verify Skills CLI discovers exactly the packaged skill
        run: python scripts/check_skill_discovery.py
      - name: Verify isolated Codex and Claude Code target installations
        run: python scripts/check_skill_installation.py
